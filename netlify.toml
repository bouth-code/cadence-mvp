[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_VERSION = "10.2.0"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = "!{path: ^/api/|^/_next/|^/public/}"

[dev]
  command = "npm run dev"
  port = 3000

[context.production]
  command = "npm run build"
  publish = ".next"

[env.production]
  CLAUDE_API_KEY = "placeholder"
  NEXT_PUBLIC_SITE_URL = "https://charming-peony-6b6d1b.netlify.app"
